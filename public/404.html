<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fdfcf9" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Seite nicht gefunden / Page not found | Energie Pferd</title>
    <style>
      :root {
        color: #523f37;
        background: #fdfcf9;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 2.5rem));
        text-align: center;
      }

      .eyebrow {
        color: #6a5348;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0 0;
        color: #2b221f;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 1.25rem 0 0;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 2rem;
        border-radius: 999px;
        background: #00917d;
        color: #fdfcf9;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.8rem 1.5rem;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #007a69;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Fehler 404</div>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>
        Vielleicht hat sich der Link verändert. Auf der Startseite findest du alle Angebote und
        Kontaktmöglichkeiten.
      </p>
      <a href="/">Zur Startseite</a>
      <div lang="en">
        <h1>Page not found.</h1>
        <p>The link may have changed. You can find all sessions and contact options on the homepage.</p>
        <a href="/en/">English homepage</a>
      </div>
    </main>
  </body>
</html>
